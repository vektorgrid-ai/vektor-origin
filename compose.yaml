services:
  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - aiassistant
        
  core:
    build:
      context: .
      dockerfile: AssistantCore/Dockerfile
    ports:
      - "5264:5264"
    environment:
      - USE_FILE_LOGGING=false
      - SEQ_URL=http://seq:5341
      - MINIMUM_LOG_LEVEL=Debug
      - MAXIMUM_AUTO_APPROVE_RISK_LEVEL=Medium
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-service-key.json
    networks:
      - aiassistant
    depends_on:
      - seq

networks:
  aiassistant:
    external: true
